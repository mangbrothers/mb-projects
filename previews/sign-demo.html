<title>Signing page preview</title>
<!--
  Customer page for agreements emailed from the CRM (phone sales). One link: read the quote and agreement,
  sign with a typed name, choose a payment method (card first; bank account and check under More options),
  then a confirmation page. It holds nothing private. The link carries a one-time token (t) and the address
  of the signing service (s), a Google Apps Script on admin@mangbrothers.com. Card and bank numbers are
  never received or stored by Mangiapane Brothers: the card form here sends the card straight to Intuit (QuickBooks Payments)
  for a one-time token. If the signing service switches card mode off, the card step emails a QuickBooks page instead.
  Agreement numbers starting TEST- are test agreements: a red banner on every step, no service, $1 charges.
-->
<style>

    --brand:#5fbf78;--brand-ink:#0f1511;--brand-soft:#173322;--red:#e07a7a;--amber:#f0c674;--amber-soft:#3a2d14;--amber-line:#8a6a2a}}

(function(){
  const SAMPLES = {"L": {"text": "# SEASONAL SERVICES AGREEMENT\n\nFall Cleanup \u2022 Snow & Ice Removal\n\n**Agreement No.:** MB-20261024-WR1I\n**Effective Date:** October 24, 2026\n\nThis Seasonal Services Agreement is entered into by and between **Mangiapane Brothers LLC** (the \u201cCompany\u201d) and the customer identified below (the \u201cCustomer\u201d). The Company and the Customer are each a \u201cParty\u201d and together the \u201cParties.\u201d The Parties agree as follows:\n\n## Article 1: Parties, Property and Term\n\n|= | Customer Information\n| Name | Linda Park\n| Address | 14320 Merriman Rd, Livonia\n| Phone | 734-555-0190\n| Email | linda@example.com\n| Second email | linda2@example.com\n\n**1.1 Service Property.** The services will be performed at: 14320 Merriman Rd, Livonia\n\n**1.2 Property Type.** Residential\n\n**1.3 Service Areas.** Driveway, apron, front walk to the door, porch steps, and the public sidewalk across the front of the lot.\n\n**1.4 Term.** This Agreement begins on the Effective Date and covers the season(s) below. It ends when the last selected season ends unless renewed in writing.\n\n|= Service | Timeframe\n| Fall Cleanup | Two visits, October to November, timed to the city leaf pickup for the Property's section\n| Snow & Ice Removal | November 1 to March 15\n\n## Article 2: Services and Pricing\n\nThe Customer purchases only the services listed below at the prices stated. All prices include card processing; there is no separate card fee.\n\n### 2.1 Fall Cleanup\n\n**Full Fall Cleanup.** Two leaf visits timed to the city curbside pickup for the Property's section; gutters cleared on the final visit; a look at the roof from the ladder; flower beds cleared of leaves and debris; sticks and branches gathered; everything blown to the curb for city pickup. Not included: bed cleanouts, mulch, bagging or hauling, and written roof inspections.\n\n|= Item | Price\n| Full Fall Cleanup, South Livonia | $450\n|+ Fall Cleanup Total | $450\n\n### 2.3 Snow Removal\n\n|= Item | Price\n| Standard lot, season, South Livonia | $570\n|+ Snow Removal Season Total | $570\n| Each visit after the sixteenth (Section 4.8) | $45\n\n## Article 3: Fall Cleanup Terms\n\n**3.1 Scheduling.** The Company schedules two visits, each timed to the city curbside leaf pickup for the Property's section. Gutters are cleared on the final visit.\n\n**3.2 Debris Disposal.** Leaves and yard waste are blown to the curb for the city's collection service. The Company does not bag or haul leaves.\n\n**3.3 Gutters.** Gutter cleaning covers gutters safely reachable by ladder. If the crew determines a gutter is unsafe to clean, the Company will notify the Customer.\n\n**3.4 Concealed Items.** The Company is not responsible for damage to items concealed by leaves or vegetation, including hoses, toys, unmarked sprinkler heads and low-voltage wiring.\n\n## Article 4: Snow and Ice Removal Terms\n\n**4.1 Trigger Depth.** Service is performed when 1 inch or more of snow has accumulated, as measured by the Company at the Property. Drifting snow does not count toward the trigger depth.\n\n**4.2 Timing.** The Company is not required to begin service until a storm has stopped, and will clear the Property within 24 hours after the storm stops. The Company determines when a storm has stopped. The Company may, at its sole discretion, begin clearing during a storm and make more than one pass. Passes made during a storm that brings 5 inches or less count as one visit together with the pass after it; when a storm brings more than 5 inches, each pass counts as a separate visit. The Company does not guarantee completion by a specific time.\n\n**4.3 Route Priority.** The Company sets its service routes to serve every customer in an efficient and timely manner. Commercial and emergency-access accounts may be serviced first.\n\n**4.4 Municipal Plow Windrows.** Snow deposited at the driveway apron by city or county plows after a Company visit will be cleared on the next visit, unless the Customer requests a return trip. A return trip counts as a visit under Section 4.8.\n\n**4.5 Salt and Ice.** Salt is applied to the cleared areas after every visit. Snow removal does not eliminate all ice. The Customer acknowledges that melting, refreezing and runoff can create ice between visits that is outside the Company\u2019s control.\n\n**4.6 Snow Placement.** The Company will pile snow in reasonable locations on the Property and will not push snow into public streets.\n\n**4.7 Site Markers.** The Company may install stakes or markers along drive edges, curbs, beds and fixtures before the first snowfall. The Customer shall leave markers in place until the season ends. If they are removed, the Customer is liable for any resulting damage.\n\n**4.8 Season Limit.** The season price covers up to sixteen (16) visits, counted under Section 4.2. Each visit after the sixteenth is charged to the payment method on file after that visit, at the per-visit rate in Section 2.3 ($45).\n\n**4.9 Service Hours.** The Company does not operate equipment at residential properties before 7:00 a.m. or after 11:00 p.m.\n\n**4.10 Visit Photos.** The Company takes a time-stamped photo of the Property after every visit and sends it to the Customer. These photos are the Company\u2019s record that the visit was made.\n\n## Article 6: Payment Terms\n\n**6.1 Payment Schedule.** Fall Cleanup and Snow Removal are paid in full at signing. Holiday Lighting is paid fifty percent (50%) at signing and the balance on the day installation is complete. Visits past the season limit are charged under Section 4.8, and additional lighting service calls under Section 5.4. No service is scheduled until the amount due at signing has been paid.\n\n**6.2 Payment Method on File.** The Customer shall keep a valid credit or debit card on file with the Company for the length of this Agreement. With the Company\u2019s approval, the Customer may instead keep a bank account on file for electronic (ACH) payment. A Customer who does not keep a payment method on file may instead pay every amount under this Agreement in advance by check at signing, payable to Mangiapane Brothers LLC; no service is scheduled until the check is received. Payment information is stored by the Company\u2019s payment processor, QuickBooks Payments (Intuit Inc.). The Company keeps only the card brand and last four digits.\n\n**6.3 Due Dates and Declined Payments.** Each amount is due on the day stated in this Agreement. If a charge to the payment method on file is declined or fails for any reason, including an expired card or insufficient funds, the amount is past due as of that day. The Company will notify the Customer, and the Customer shall pay the amount or provide a working payment method. While any amount is past due, the Company may retry the charge, suspend service, and collect the amount under Section 6.5. Suspension does not reduce the amount owed. Any additional time the Company allows is at its discretion and does not waive this Section.\n\n**6.4 Reversed Payments.** If a payment is reversed, charged back, or returned after the Company has performed the service it paid for, the amount remains due, and the Customer shall also pay any fees the Company is charged for the reversal.\n\n**6.5 Collection Costs.** To the extent permitted by Michigan law, the Customer shall pay reasonable collection costs and attorney fees incurred by the Company to collect any unpaid balance.\n\n**6.6 Billing Disputes.** The Customer must dispute any charge in writing (text or email is acceptable) within 30 days of the receipt for it. Undisputed amounts remain due when payable.\n\n**6.7 Authorization to Charge.** By signing this Agreement, the Customer authorizes Mangiapane Brothers LLC to charge the payment method on file, without a separate approval each time, for: (a) each amount due under Section 6.1 when it comes due; (b) visits after the season limit under Section 4.8; (c) additional lighting service calls under Section 5.4; (d) replacement of Company materials under Section 5.2; and (e) any additional service the Customer requests in writing (text or email is acceptable) at the price agreed for it. This authorization remains in effect until every amount owed under this Agreement has been paid. The Customer may replace the payment method on file at any time by contacting the Company.\n\n**6.8 Receipts.** The Company emails a receipt for every charge to the email address(es) in Article 1, showing the service, the Property, the date of service, and the amount. The Company does not send notice before a charge; the receipt is the Customer\u2019s record. Charges appear on statements as Mangiapane Brothers.\n\n|= Payment Summary | Amount\n| 2.1 Fall Cleanup | $450\n| 2.3 Snow Removal (season) | $570\n|+ Charged at signing (Section 6.1) | $1,020\n| Each snow visit after the sixteenth, charged after the visit | $45\n\n## Article 7: Customer Obligations\n\nThe Customer shall:\n\n**7.1** Provide access to all service areas, including unlocked gates.\n\n**7.2** Keep service areas clear of vehicles, refuse containers, toys, hoses and other objects. Blocked areas may be skipped or serviced around and will still be charged.\n\n**7.3** Identify or mark concealed or fragile items before service, including sprinkler heads, landscape lighting, buried cables, invisible pet fencing, low walls, decorative stones and curbing.\n\n**7.4** Keep pets secured during service visits.\n\n**7.5** Report any damage or service deficiency in writing (text or email is acceptable) within forty-eight (48) hours of the visit, with photographs when possible. Late claims may be denied.\n\n**7.6** Promptly notify the Company of changes to the Property, including new landscaping, construction, or a change in ownership or occupancy.\n\n**Pre-existing conditions noted at signing:** None noted\n\n## Article 8: Insurance, Liability and Force Majeure\n\n**8.1 Insurance.** The Company maintains general liability insurances related to the services provided.\n\n**8.2 Repair of Damage.** If the Company\u2019s negligence damages the Property, the Company will, at its option, repair the damage or pay the reasonable cost of repair, provided the Customer gives timely notice under Section 7.5.\n\n**8.3 Exclusions.** The Company is not responsible for: ordinary wear to turf, lawn edges and gravel from plowing; damage to concealed, unmarked or undisclosed items; pre-existing conditions; effects of ordinary salt or ice-melt use (including concrete scaling and damage to plants or turf) where such service was requested; or damage to concrete, asphalt or pavers in poor condition.\n\n**8.4 Changing Conditions.** Snow and ice conditions may change after the Company leaves the Property. The Customer remains responsible for monitoring the Property between visits, warning visitors of hazards, and requesting additional service when needed. The Company is responsible only for its own negligence in performing the services selected in Article 2.\n\n**8.5 Limitation of Liability.** Except for gross negligence or willful misconduct, the Company\u2019s total liability under this Agreement shall not exceed the amount paid by the Customer for the season in which the claim arose. Neither Party is liable for indirect, incidental or consequential damages, including lost profits or rental income.\n\n**8.6 Force Majeure.** The Company is not in breach for delays or failures caused by severe weather, travel bans, equipment failure, fuel shortages, illness, road closures or other events beyond its reasonable control. Service will resume as soon as reasonably practicable.\n\n## Article 9: Cancellation and Termination\n\n**9.1 Customer\u2019s Three-Day Right to Cancel.** The Customer may cancel this Agreement, without any penalty or obligation, at any time before midnight of the third business day after the date of this Agreement, by written notice to the Company. If the Customer cancels within that period, the Company will refund all payments made under this Agreement, to the original payment method, within 10 business days after receiving the notice. See the Notice of Cancellation at the end of this Agreement.\n\n**9.2 By Company.** The Company may terminate this Agreement on 3 days\u2019 written notice, or immediately for non-payment, unsafe conditions, or abusive conduct toward Company personnel. The Company will refund prepaid amounts for services not performed, to the original payment method.\n\n**9.3 No Automatic Renewal.** This Agreement does not renew automatically. The Company may offer renewal in writing before the next season.\n\n## Article 10: General Provisions\n\n**10.1 Independent Contractor.** The Company is an independent contractor and controls the means, methods, equipment, and personnel used to perform the services, and may use subcontractors.\n\n**10.2 Photographs.** The Company photographs the Property before and after service. Photos may be sent to the Customer with receipts and visit records and are kept as the Company\u2019s service records.\n\n**10.3 Entire Agreement; Amendments.** This Agreement, with any attached exhibits, is the entire agreement of the Parties and supersedes all prior discussions. Amendments must be in writing and signed or confirmed by email by both Parties.\n\n**10.4 Governing Law; Venue.** This Agreement is governed by the laws of the State of Michigan. Any dispute shall be brought in the courts of Wayne County, Michigan, including small claims court where eligible.\n\n**10.5 Severability.** If any provision is held unenforceable, the remaining provisions remain in full force and effect.\n\n**10.6 Notices.** Notices under this Agreement may be delivered by hand, mail, or email to the addresses in Article 1.\n\n**10.7 Counterparts; Electronic Signatures and Records.** This Agreement may be signed in counterparts and by electronic signature, each of which is deemed an original. The Customer agrees to receive this Agreement, the Notice of Cancellation, receipts, and other notices electronically at the email address(es) in Article 1, and may ask for a paper copy at any time at no charge.\n\n## Signatures\n\nIN WITNESS WHEREOF, the Parties have executed this Agreement as of the dates below.\n\n**You, the buyer, may cancel this transaction at any time prior to midnight of the third business day after the date of this transaction. See the attached notice of cancellation form for an explanation of this right. Additionally, the seller is prohibited from having an independent courier service or other third party pick up your payment at your residence before the end of the 3-business-day period in which you can cancel the transaction.**\n\n**If you cancel within that period, all payments you have made will be refunded in full within 10 business days after the Company receives your cancellation notice.**", "notice": "## NOTICE OF CANCELLATION\n\n**Date of transaction:** October 24, 2026\n**Agreement No.:** MB-20261024-WR1I\n\nYou may cancel this transaction, without any penalty or obligation, within three business days from the above date.\n\nIf you cancel, any property traded in, any payments made by you under the contract or sale, and any negotiable instrument executed by you will be returned within 10 business days following receipt by the seller of your cancellation notice, and any security interest arising out of the transaction will be cancelled.\n\nIf you cancel, you must make available to the seller at your residence, in substantially as good condition as when received, any goods delivered to you under this contract or sale; or you may, if you wish, comply with the instructions of the seller regarding the return shipment of the goods at the seller\u2019s expense and risk.\n\nIf you do make the goods available to the seller and the seller does not pick them up within 20 days of the date of your notice of cancellation, you may retain or dispose of the goods without any further obligation. If you fail to make the goods available to the seller, or if you agree to return the goods to the seller and fail to do so, then you remain liable for performance of all obligations under the contract.\n\nTo cancel this transaction, mail or deliver a signed and dated copy of this cancellation notice or any other written notice to **Mangiapane Brothers LLC**, at **3540 Thorn Tree Ct., Ann Arbor, MI 48105**, or by email to **admin@mangbrothers.com**, not later than midnight of **October 28, 2026**.\n\nQuestions about cancelling: call Mangiapane Brothers LLC at **734-450-2400**.\n\n**I hereby cancel this transaction.**\n\nDate: ______________________________\nBuyer\u2019s signature: ______________________________", "lines": [["Fall Cleanup", 450], ["Snow Removal, season", 570]], "amount": 1020, "dueNow": 1020, "agreementNo": "MB-20261024-WR1I", "companySigner": "Russel"}, "W": {"text": "# SEASONAL SERVICES AGREEMENT\n\nFall Cleanup \u2022 Snow & Ice Removal\n\n**Agreement No.:** MB-20261024-WL7T\n**Effective Date:** October 24, 2026\n\nThis Seasonal Services Agreement is entered into by and between **Mangiapane Brothers LLC** (the \u201cCompany\u201d) and the customer identified below (the \u201cCustomer\u201d). The Company and the Customer are each a \u201cParty\u201d and together the \u201cParties.\u201d The Parties agree as follows:\n\n## Article 1: Parties, Property and Term\n\n|= | Customer Information\n| Name | Tom Reyes\n| Address | 8830 Cardwell St, Westland\n| Phone | 734-555-0164\n| Email | tom@example.com\n\n**1.1 Service Property.** The services will be performed at: 8830 Cardwell St, Westland\n\n**1.2 Property Type.** Residential\n\n**1.3 Service Areas.** Driveway, apron, front walk to the door, porch steps, and the public sidewalk across the front of the lot.\n\n**1.4 Term.** This Agreement begins on the Effective Date and covers the season(s) below. It ends when the last selected season ends unless renewed in writing.\n\n|= Service | Timeframe\n| Fall Cleanup | One visit in November, scheduled by the Company after most of the leaves have fallen\n| Snow & Ice Removal | November 1 to March 15\n\n## Article 2: Services and Pricing\n\nThe Customer purchases only the services listed below at the prices stated. All prices include card processing; there is no separate card fee.\n\n### 2.1 Fall Cleanup\n\n**Westland Fall Cleanup.** One visit in November, after most of the leaves have fallen: leaves raked or blown from the lawn and flower beds, sticks and branches gathered, and everything hauled away by the Company. Not included: gutter cleaning, roof checks, bed cleanouts, mulch, and leaves that fall after the visit.\n\n|= Item | Price\n| Westland Fall Cleanup, one visit | $450\n|+ Fall Cleanup Total | $450\n\n### 2.3 Snow Removal\n\n|= Item | Price\n| Standard lot, season, Westland | $570\n|+ Snow Removal Season Total | $570\n| Each visit after the sixteenth (Section 4.8) | $45\n\n## Article 3: Fall Cleanup Terms\n\n**3.1 Scheduling.** The Company schedules one visit in November, after most of the leaves have fallen, and sets the date of the visit. Leaves that fall after the visit are not included.\n\n**3.2 Debris Disposal.** Leaves and yard waste gathered during the visit are hauled away by the Company.\n\n**3.3 Gutters.** Gutter cleaning is not included in the Westland Fall Cleanup.\n\n**3.4 Concealed Items.** The Company is not responsible for damage to items concealed by leaves or vegetation, including hoses, toys, unmarked sprinkler heads and low-voltage wiring.\n\n## Article 4: Snow and Ice Removal Terms\n\n**4.1 Trigger Depth.** Service is performed when 1 inch or more of snow has accumulated, as measured by the Company at the Property. Drifting snow does not count toward the trigger depth.\n\n**4.2 Timing.** The Company is not required to begin service until a storm has stopped, and will clear the Property within 24 hours after the storm stops. The Company determines when a storm has stopped. The Company may, at its sole discretion, begin clearing during a storm and make more than one pass. Passes made during a storm that brings 5 inches or less count as one visit together with the pass after it; when a storm brings more than 5 inches, each pass counts as a separate visit. The Company does not guarantee completion by a specific time.\n\n**4.3 Route Priority.** The Company sets its service routes to serve every customer in an efficient and timely manner. Commercial and emergency-access accounts may be serviced first.\n\n**4.4 Municipal Plow Windrows.** Snow deposited at the driveway apron by city or county plows after a Company visit will be cleared on the next visit, unless the Customer requests a return trip. A return trip counts as a visit under Section 4.8.\n\n**4.5 Salt and Ice.** Salt is applied to the cleared areas after every visit. Snow removal does not eliminate all ice. The Customer acknowledges that melting, refreezing and runoff can create ice between visits that is outside the Company\u2019s control.\n\n**4.6 Snow Placement.** The Company will pile snow in reasonable locations on the Property and will not push snow into public streets.\n\n**4.7 Site Markers.** The Company may install stakes or markers along drive edges, curbs, beds and fixtures before the first snowfall. The Customer shall leave markers in place until the season ends. If they are removed, the Customer is liable for any resulting damage.\n\n**4.8 Season Limit.** The season price covers up to sixteen (16) visits, counted under Section 4.2. Each visit after the sixteenth is charged to the payment method on file after that visit, at the per-visit rate in Section 2.3 ($45).\n\n**4.9 Service Hours.** The Company does not operate equipment at residential properties before 7:00 a.m. or after 11:00 p.m.\n\n**4.10 Visit Photos.** The Company takes a time-stamped photo of the Property after every visit and sends it to the Customer. These photos are the Company\u2019s record that the visit was made.\n\n## Article 6: Payment Terms\n\n**6.1 Payment Schedule.** Fall Cleanup and Snow Removal are paid in full at signing. Holiday Lighting is paid fifty percent (50%) at signing and the balance on the day installation is complete. Visits past the season limit are charged under Section 4.8, and additional lighting service calls under Section 5.4. No service is scheduled until the amount due at signing has been paid.\n\n**6.2 Payment Method on File.** The Customer shall keep a valid credit or debit card on file with the Company for the length of this Agreement. With the Company\u2019s approval, the Customer may instead keep a bank account on file for electronic (ACH) payment. A Customer who does not keep a payment method on file may instead pay every amount under this Agreement in advance by check at signing, payable to Mangiapane Brothers LLC; no service is scheduled until the check is received. Payment information is stored by the Company\u2019s payment processor, QuickBooks Payments (Intuit Inc.). The Company keeps only the card brand and last four digits.\n\n**6.3 Due Dates and Declined Payments.** Each amount is due on the day stated in this Agreement. If a charge to the payment method on file is declined or fails for any reason, including an expired card or insufficient funds, the amount is past due as of that day. The Company will notify the Customer, and the Customer shall pay the amount or provide a working payment method. While any amount is past due, the Company may retry the charge, suspend service, and collect the amount under Section 6.5. Suspension does not reduce the amount owed. Any additional time the Company allows is at its discretion and does not waive this Section.\n\n**6.4 Reversed Payments.** If a payment is reversed, charged back, or returned after the Company has performed the service it paid for, the amount remains due, and the Customer shall also pay any fees the Company is charged for the reversal.\n\n**6.5 Collection Costs.** To the extent permitted by Michigan law, the Customer shall pay reasonable collection costs and attorney fees incurred by the Company to collect any unpaid balance.\n\n**6.6 Billing Disputes.** The Customer must dispute any charge in writing (text or email is acceptable) within 30 days of the receipt for it. Undisputed amounts remain due when payable.\n\n**6.7 Authorization to Charge.** By signing this Agreement, the Customer authorizes Mangiapane Brothers LLC to charge the payment method on file, without a separate approval each time, for: (a) each amount due under Section 6.1 when it comes due; (b) visits after the season limit under Section 4.8; (c) additional lighting service calls under Section 5.4; (d) replacement of Company materials under Section 5.2; and (e) any additional service the Customer requests in writing (text or email is acceptable) at the price agreed for it. This authorization remains in effect until every amount owed under this Agreement has been paid. The Customer may replace the payment method on file at any time by contacting the Company.\n\n**6.8 Receipts.** The Company emails a receipt for every charge to the email address(es) in Article 1, showing the service, the Property, the date of service, and the amount. The Company does not send notice before a charge; the receipt is the Customer\u2019s record. Charges appear on statements as Mangiapane Brothers.\n\n|= Payment Summary | Amount\n| 2.1 Fall Cleanup | $450\n| 2.3 Snow Removal (season) | $570\n|+ Charged at signing (Section 6.1) | $1,020\n| Each snow visit after the sixteenth, charged after the visit | $45\n\n## Article 7: Customer Obligations\n\nThe Customer shall:\n\n**7.1** Provide access to all service areas, including unlocked gates.\n\n**7.2** Keep service areas clear of vehicles, refuse containers, toys, hoses and other objects. Blocked areas may be skipped or serviced around and will still be charged.\n\n**7.3** Identify or mark concealed or fragile items before service, including sprinkler heads, landscape lighting, buried cables, invisible pet fencing, low walls, decorative stones and curbing.\n\n**7.4** Keep pets secured during service visits.\n\n**7.5** Report any damage or service deficiency in writing (text or email is acceptable) within forty-eight (48) hours of the visit, with photographs when possible. Late claims may be denied.\n\n**7.6** Promptly notify the Company of changes to the Property, including new landscaping, construction, or a change in ownership or occupancy.\n\n**Pre-existing conditions noted at signing:** None noted\n\n## Article 8: Insurance, Liability and Force Majeure\n\n**8.1 Insurance.** The Company maintains general liability insurances related to the services provided.\n\n**8.2 Repair of Damage.** If the Company\u2019s negligence damages the Property, the Company will, at its option, repair the damage or pay the reasonable cost of repair, provided the Customer gives timely notice under Section 7.5.\n\n**8.3 Exclusions.** The Company is not responsible for: ordinary wear to turf, lawn edges and gravel from plowing; damage to concealed, unmarked or undisclosed items; pre-existing conditions; effects of ordinary salt or ice-melt use (including concrete scaling and damage to plants or turf) where such service was requested; or damage to concrete, asphalt or pavers in poor condition.\n\n**8.4 Changing Conditions.** Snow and ice conditions may change after the Company leaves the Property. The Customer remains responsible for monitoring the Property between visits, warning visitors of hazards, and requesting additional service when needed. The Company is responsible only for its own negligence in performing the services selected in Article 2.\n\n**8.5 Limitation of Liability.** Except for gross negligence or willful misconduct, the Company\u2019s total liability under this Agreement shall not exceed the amount paid by the Customer for the season in which the claim arose. Neither Party is liable for indirect, incidental or consequential damages, including lost profits or rental income.\n\n**8.6 Force Majeure.** The Company is not in breach for delays or failures caused by severe weather, travel bans, equipment failure, fuel shortages, illness, road closures or other events beyond its reasonable control. Service will resume as soon as reasonably practicable.\n\n## Article 9: Cancellation and Termination\n\n**9.1 Customer\u2019s Three-Day Right to Cancel.** The Customer may cancel this Agreement, without any penalty or obligation, at any time before midnight of the third business day after the date of this Agreement, by written notice to the Company. If the Customer cancels within that period, the Company will refund all payments made under this Agreement, to the original payment method, within 10 business days after receiving the notice. See the Notice of Cancellation at the end of this Agreement.\n\n**9.2 By Company.** The Company may terminate this Agreement on 3 days\u2019 written notice, or immediately for non-payment, unsafe conditions, or abusive conduct toward Company personnel. The Company will refund prepaid amounts for services not performed, to the original payment method.\n\n**9.3 No Automatic Renewal.** This Agreement does not renew automatically. The Company may offer renewal in writing before the next season.\n\n## Article 10: General Provisions\n\n**10.1 Independent Contractor.** The Company is an independent contractor and controls the means, methods, equipment, and personnel used to perform the services, and may use subcontractors.\n\n**10.2 Photographs.** The Company photographs the Property before and after service. Photos may be sent to the Customer with receipts and visit records and are kept as the Company\u2019s service records.\n\n**10.3 Entire Agreement; Amendments.** This Agreement, with any attached exhibits, is the entire agreement of the Parties and supersedes all prior discussions. Amendments must be in writing and signed or confirmed by email by both Parties.\n\n**10.4 Governing Law; Venue.** This Agreement is governed by the laws of the State of Michigan. Any dispute shall be brought in the courts of Wayne County, Michigan, including small claims court where eligible.\n\n**10.5 Severability.** If any provision is held unenforceable, the remaining provisions remain in full force and effect.\n\n**10.6 Notices.** Notices under this Agreement may be delivered by hand, mail, or email to the addresses in Article 1.\n\n**10.7 Counterparts; Electronic Signatures and Records.** This Agreement may be signed in counterparts and by electronic signature, each of which is deemed an original. The Customer agrees to receive this Agreement, the Notice of Cancellation, receipts, and other notices electronically at the email address(es) in Article 1, and may ask for a paper copy at any time at no charge.\n\n## Signatures\n\nIN WITNESS WHEREOF, the Parties have executed this Agreement as of the dates below.\n\n**You, the buyer, may cancel this transaction at any time prior to midnight of the third business day after the date of this transaction. See the attached notice of cancellation form for an explanation of this right. Additionally, the seller is prohibited from having an independent courier service or other third party pick up your payment at your residence before the end of the 3-business-day period in which you can cancel the transaction.**\n\n**If you cancel within that period, all payments you have made will be refunded in full within 10 business days after the Company receives your cancellation notice.**", "notice": "## NOTICE OF CANCELLATION\n\n**Date of transaction:** October 24, 2026\n**Agreement No.:** MB-20261024-WL7T\n\nYou may cancel this transaction, without any penalty or obligation, within three business days from the above date.\n\nIf you cancel, any property traded in, any payments made by you under the contract or sale, and any negotiable instrument executed by you will be returned within 10 busines <script>
"use strict";
const PHONE = "734-450-2400", EMAIL = "admin@mangbrothers.com";
const q = new URLSearchParams(location.search);
const TOKEN = (q.get("t")||"").replace(/[^\w-]/g,""), DEPLOY = (q.get("s")||"").replace(/[^\w-]/g,"");
const SVC = DEPLOY ? `https://script.google.com/macros/s/${DEPLOY}/exec` : "";
const $ = s => document.querySelector(s);
const esc = s => String(s==null?"":s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money = v => { if(v===""||v==null||isNaN(+v)) return ""; const n=+v, neg=n<0, a=Math.abs(n), cents=Math.round(a*100)%100!==0; return (neg?"−":"")+"$"+a.toLocaleString("en-US",{minimumFractionDigits:cents?2:0,maximumFractionDigits:2}); };
const fmtStamp = ms => ms ? new Date(ms).toLocaleString("en-US",{timeZone:"America/Detroit",month:"long",day:"numeric",year:"numeric",hour:"numeric",minute:"2-digit"}) : "";
const first = A => String(A.signerName||"").split(" ")[0];
const contact = `Questions: call <a href="tel:+17344502400">${PHONE}</a> or email <a href="mailto:${EMAIL}">${EMAIL}</a>.`;
const TEST_TEXT = "TEST AGREEMENT. No service will be performed. Charges are $1.00 and can be refunded.";
let IS_TEST = false;
const testBar = () => IS_TEST ? `<div class="testbar" role="note">${TEST_TEXT}</div>` : "";
const steps = n => testBar() + `<div class="steps">${["Sign","Payment method","Done"].map((s,i)=>`<span class="${i===n?"on":i<n?"ok":""}">${i<n?"✓ ":""}${i+1}. ${s}</span>`).join("")}</div>`;

// Same text rules as the CRM: headings, bold, lists and tables ("|" lines; "|=" header, "|+" total).
function table(lines, inline){
  return "<table>"+lines.map(l=>{ const kind=l[1]==="="?"h":l[1]==="+"?"t":""; const cells=l.replace(/^\|[=+]?/,"").split(/\s*\|\s*/).map(x=>x.trim());
    return `<tr${kind==="t"?' class="tot"':""}>`+cells.map((x,i)=> kind==="h" ? `<th>${inline(x)}</th>` : `<td${i===cells.length-1&&/^[+−-]?\$/.test(x)?' class="r"':""}>${inline(x)}</td>`).join("")+"</tr>"; }).join("")+"</table>";
}
function renderDoc(text){
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
  return String(text||"").replace(/\r/g,"").split(/\n{2,}/).map(b=>{
    let lines=b.split("\n").filter(l=>l.trim()!==""); if(!lines.length) return "";
    let head=""; const h=/^(#{1,3})\s+(.*)$/.exec(lines[0]);
    if(h){ const n=h[1].length+1; head=`<h${n}>${inline(h[2])}</h${n}>`; lines=lines.slice(1); if(!lines.length) return head; }
    if(lines.every(l=>/^\|/.test(l))) return head+table(lines, inline);
    if(lines.every(l=>/^\s*[-*]\s+/.test(l))) return head+"<ul>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>").join("")+"</ul>";
    if(lines.every(l=>/^\s*\d+[.)]\s+/.test(l))) return head+"<ol>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*\d+[.)]\s+/,""))+"</li>").join("")+"</ol>";
    return head+"<p>"+lines.map(inline).join("<br>")+"</p>";
  }).join("");
}
// The quote: one row per service, then the total and what is charged when, set apart under a rule. The snow price
// past sixteen visits is a note under the quote, marked by an asterisk on the snow line.
const isSnowLine = l => /^snow/i.test(String(l && l[0] || ""));
function snowNote(A, starred){ return A.perVisit ? `<p class="foot">${starred?"* ":""}Snow visits after the sixteenth are ${esc(money(A.perVisit))} each, charged after the visit.</p>` : ""; }
function quoteRows(A, withLines){
  const r=(a,b)=>`<tr><td>${a}</td><td>${b}</td></tr>`, t=(a,b,cls)=>`<div class="trow ${cls}"><span>${a}</span><span>${b}</span></div>`;
  const lines = withLines ? (A.lines||[]) : [], starred = !!A.perVisit && lines.some(isSnowLine);
  return `${lines.length?`<table class="quote">${lines.map(l=>r(esc(l[0])+(starred&&isSnowLine(l)?"<sup>*</sup>":""),esc(money(l[1])))).join("")}</table>`:""}
    <div class="totals${lines.length?"":" solo"}">${lines.length?t("Total",esc(money(A.total)),"tot"):""}
    ${t("Charged today",esc(money(A.dueNow)||"$0"),"today")}
    ${A.dueInstall>0?t("Charged when your lights are installed",esc(money(A.dueInstall)),"later"):""}</div>
    ${snowNote(A, starred)}`;
}

async function call(action, body){
  if(!SVC || !TOKEN) throw new Error("This link is incomplete.");
  const r = body
    ? await fetch(SVC, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body:JSON.stringify({ action, t:TOKEN, ...body }) })
    : await fetch(`${SVC}?action=${action}&t=${encodeURIComponent(TOKEN)}`, { redirect:"follow" });
  if(!r.ok) throw new Error("Our system did not answer ("+r.status+").");
  return r.json();
}
function message(title, text){
  document.body.style.paddingBottom="0";

// ---------- step 2: payment method ----------
// "token" (live): the card form below, with the security code, sends the card straight to Intuit from this browser for a
// one-time token. Only the token comes to us. Bank accounts get the emailed QuickBooks page.
// "off" (kill switch in the signing service): no card form. Add my card asks the office to email a secure QuickBooks page.
const INTUIT_TOKENS = { sandbox:"https://sandbox.api.intuit.com/quickbooks/v4/payments/tokens", production:"https://api.intuit.com/quickbooks/v4/payments/tokens" };
// reCAPTCHA v3 (required by Intuit for payment apps). The site key comes from the signing service; the secret never leaves it.
let captchaReady = null;
function loadCaptcha(key){
  if(!key) return Promise.reject(new Error("no key"));
  if(captchaReady) return captchaReady;
  captchaReady = new Promise((ok, no) => {
    const sc = document.createElement("script");
    sc.src = "https://www.google.com/recaptcha/api.js?render=" + encodeURIComponent(key);
    sc.async = true; sc.onerror = () => { captchaReady = null; no(new Error("blocked")); };
    sc.onload = () => window.grecaptcha ? grecaptcha.ready(ok) : no(new Error("blocked"));
    document.head.appendChild(sc);
  });
  return captchaReady;
}
async function captchaToken(key){
  try{ await loadCaptcha(key); return await grecaptcha.execute(key, { action:"card" }); }
  catch(e){ const x = new Error("Our security check could not load in this browser. A content blocker or privacy setting can cause this. Turn it off for this page and try again, or tap \"Email me a secure QuickBooks page instead\" below."); x.netFail = true; throw x; }
}
async function intuitToken(card, env){
  let r;
  try{ r = await fetch(INTUIT_TOKENS[env==="production"?"production":"sandbox"], { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" }, body:JSON.stringify({ card }) }); }
  catch(e){ const x = new Error("Your browser could not reach our payment processor. A content blocker or privacy setting can cause this. You can turn it off for this page and try again, or tap \"Email me a secure QuickBooks page instead\" below."); x.netFail = true; throw x; }
  let j={}; try{ j = await r.json(); }catch(e){}
  if(!r.ok || !j.value){ const m = j.errors && j.errors[0] && (j.errors[0].message||j.errors[0].code); throw new Error("The card was not accepted"+(m?": "+m:"")+". Check the details and try again."); }
  return j.value;
}
const digits = v => String(v||"").replace(/\D/g,"");
function luhn(n){ let s=0, alt=false; for(let i=n.length-1;i>=0;i--){ let d=+n[i]; if(alt){ d*=2; if(d>9) d-=9; } s+=d; alt=!alt; } return s%10===0; }
function brandOf(n){ return /^4/.test(n)?"Visa":/^(5[1-5]|2[2-7])/.test(n)?"Mastercard":/^3[47]/.test(n)?"Amex":/^(6011|65|64[4-9]|622)/.test(n)?"Discover":""; }
function abaOk(r){ if(!/^\d{9}$/.test(r)) return false; const d=r.split("").map(Number); return (3*(d[0]+d[3]+d[6])+7*(d[1]+d[4]+d[7])+(d[2]+d[5]+d[8]))%10===0; }
function showPay(A){

          ${token?`<div class="field2"><label for="ccCvc">Security code</label><input id="ccCvc" name="cvc" autocomplete="cc-csc" inputmode="numeric" maxlength="4" placeholder="123"></div>`:""}

      </div></div>
    <p class="meta">${contact}</p>`;
  $("#moreBtn").onclick = () => { const m=$("#more"); m.hidden=!m.hidden; $("#moreBtn").setAttribute("aria-expanded",String(!m.hidden)); $("#moreBtn").textContent = m.hidden ? "More options ▾" : "Fewer options ▴"; };
  const err = t => { const e=$("#err"); e.hidden=!t; e.textContent=t||""; if(t) e.scrollIntoView({block:"center"}); };
  // While a card is being saved or confirmed, nothing else on this step can be chosen (no second way to pay).
  const lockOthers = on => document.querySelectorAll("#cardLink,#moreBtn,[data-choice]").forEach(x => x.disabled = on);
  loadCaptcha(A.captchaKey).catch(()=>{});
  const num=$("#ccNum"), exp=$("#ccExp");

  exp.oninput = () => { let d=digits(exp.value).slice(0,4); if(d.length===1 && +d>1) d="0"+d; exp.value = d.length>2 ? d.slice(0,2)+"/"+d.slice(2) : d; };
  // Each card submit has its own attempt id. If the reply is lost (the card may already be charged), the page never shows

    if(!R || !R.ok){
      // Before showing any failure, read the real outcome back: a garbled or misrouted reply ("Unknown request") must never
      // show an error after the card was saved and charged (Oct 21, 2026: Paul Darke saw one after a good $500 charge).
      try{ const V = await call("get"); const last = V && V.ok && V.payLast && V.payLast.attempt===attempt ? V.payLast.result : "";
        if(V && V.ok && (last==="saved" || (V.pay && V.pay.detailsAt))) return route({ ...A, ...V });
        if(V && V.ok && V.payBusy) return recheck(attempt, btn); }catch(e){ return recheck(attempt, btn); }
      if(R && /unknown request/i.test(R.error||"")) return recheck(attempt, btn);
      btn.disabled=false; lockOthers(false); btn.textContent=was; return err((R && R.error) || "Not saved.");
    }

  };
  const recheck = async (attempt, btn) => {

    const why = { declined:"Your card was declined, so nothing was charged. Try a different card, or call "+PHONE+".",
      locked:"For your security, card entry is closed for this link. Tap \"Email me a secure QuickBooks page instead\", or call "+PHONE+".",
      captcha:"We could not confirm this request came from a person, so nothing was saved or charged. Try again, or call "+PHONE+".",
      failed:"We could not save that card, and nothing was charged. Try again in a minute, or call "+PHONE+"." };
    for(let i=0;i<15;i++){
      await new Promise(r => setTimeout(r, 3000));
      let V; try{ V = await call("get"); }catch(e){ continue; }
      if(!V || !V.ok) continue;
      const last = V.payLast && V.payLast.attempt===attempt ? V.payLast.result : "";
      if(last==="saved" || (V.pay && V.pay.detailsAt && !V.payBusy)) return route({ ...A, ...V });
      if(last){ route({ ...A, ...V }); const e=$("#err"); if(e){ e.hidden=false; e.textContent=why[last]||why.failed; e.scrollIntoView({block:"center"}); } return; }

  });
}

function route(A){
  if(A.test) IS_TEST = true;
  if(A.status!=="signed") return showSign(A);
  // A card is being saved and charged right now (another tab, or a reload mid-charge): wait for the result, never show "all set" early.
  if(A.payBusy && A.payBusy.at && Date.now() - A.payBusy.at < 120000){ dropBar(); return message("We are confirming your payment", "Please do not enter your card again. Reload this page in a minute to see the result, or call "+esc(PHONE)+"."); }
  if(!A.pay) return showPay(A);
  if(A.cardMode==="token" && A.pay.choice==="card" && !A.pay.detailsAt && !A.pay.link) return showPay(A);
  return showDone(A);
}

(async function start(){
  if(!TOKEN || !SVC) return message("This link is incomplete", "Open the link exactly as it came in the email, or ask us to send it again.");
  let A;
  try{ A = await call("get"); }
  catch(e){ return message("We could not load your agreement", esc(e.message)+" Check your connection and reload this page."); }
  if(!A.ok) return message("We could not load your agreement", esc(A.error||""));
  if(A.status==="cancelled") return message("This link is no longer active", "This agreement link was withdrawn, usually because a corrected one was sent. Check your email for a newer link.");
  if(A.status==="expired") return message("This link has expired", "Agreement links work for 7 days. Call us and we will send a new one.");
  if(A.status!=="ready" && A.status!=="signed") return message("This link is not valid", "We could not find this agreement.");
  route(A);
})();
