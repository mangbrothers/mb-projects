<title>New-hire paperwork · Mangiapane Brothers</title>
<!--
  Employee page for new-hire paperwork (October 17, 2026). One private link per person, emailed by the office and
  repeated on his Training tab: paperwork.html?t={token}&s={signing service}. He fills in each form here; the page
  fills the official PDF (IRS W-4 and W-9, Michigan MI-W4, USCIS I-9, the company's agreement and a direct deposit form),
  adds his drawn signature, and for every form except the agreement seals the finished PDF with the office's public key
  before it leaves his phone. Nothing he types is kept in this browser. Only the owner, with the paperwork password,
  can open the sealed forms.
-->
<style>
  :root{color-scheme:light dark;
    --bg:#f3f5f2;--card:#ffffff;--line:#d5dbd3;--ink:#16233a;--ink2:#4a5a62;--muted:#768276;
    --brand:#1f6b33;--brand-ink:#ffffff;--brand-soft:#e3f0e5;--red:#a63b3b;--amber:#7a4f0e;--amber-soft:#fbf1dc;--amber-line:#d9a441}
  @media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
    --bg:#101612;--card:#18211b;--line:#2d3a30;--ink:#e8efe9;--ink2:#b4c2b6;--muted:#82907f;
    --brand:#5fbf78;--brand-ink:#0f1511;--brand-soft:#173322;--red:#e07a7a;--amber:#f0c674;--amber-soft:#3a2d14;--amber-line:#8a6a2a}}
  :root[data-theme="dark"]{
    --bg:#101612;--card:#18211b;--line:#2d3a30;--ink:#e8efe9;--ink2:#b4c2b6;--muted:#82907f;
    --brand:#5fbf78;--brand-ink:#0f1511;--brand-soft:#173322;--red:#e07a7a;--amber:#f0c674;--amber-soft:#3a2d14;--amber-line:#8a6a2a}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}

  header{background:var(--card);border-bottom:1px solid var(--line);padding:12px 16px}

  .hide{display:none!important}
  .sec{border-top:1px solid var(--line);margin-top:14px;padding-top:4px}
  .policy{white-space:pre-wrap;max-height:46vh;overflow:auto;border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;line-height:1.5;margin:0 0 14px;background:var(--bg)}
  @media(max-width:520px){header .tag{display:none}.g3{grid-template-columns:1fr 1fr}.g3>:first-child{grid-column:1/-1}}

<script src="https://unpkg.com/pdf-lib@1.17.1/dist/pdf-lib.min.js"></script>
<script>
// ===== Employee paperwork: shared by the employee signing page (paperwork.html) and Team Manager (team.html) =====
// October 17, 2026. The forms are the official blank PDFs (IRS W-4 2026 and W-9, Michigan MI-W4, USCIS I-9 edition
// 01/20/25) kept in /forms, and the company's own agreements served by the signing service. The employee types his
// answers on our page; this file fills the official form with them, flattens it, adds his drawn signature, then seals
// the finished PDF and his answers for the office's public key before anything leaves his phone. Only someone with the
// paperwork password can open them: the password unlocks the office's private key in the browser. The database and
// Drive only ever hold sealed copies.
const PAPER = (() => {
  const FORMS = {
    agreement: { title:"Employment or contractor agreement", short:"Agreement", gov:false },
    w4:        { title:"Form W-4, federal tax withholding", short:"W-4", file:"forms/fw4.pdf", gov:true },
    miw4:      { title:"Form MI-W4, Michigan tax withholding", short:"MI-W4", file:"forms/mi-w4.pdf", gov:true },
    i9:        { title:"Form I-9, employment eligibility", short:"I-9", file:"forms/i-9.pdf", gov:true },
    w9:        { title:"Form W-9, taxpayer ID for contractors", short:"W-9", file:"forms/fw9.pdf", gov:true },
    deposit:   { title:"Direct deposit authorization", short:"Direct deposit", gov:false, optional:true },
    privacy:   { title:"Employee information privacy policy", short:"Privacy policy", gov:false }
  };
  // Forms sealed with the vault before they leave the employee's phone. The agreement and the privacy policy
  // acknowledgment carry no tax or bank numbers and are stored as plain PDFs he can open.
  const SEALED = ["w4","miw4","i9","w9","deposit"];
  // The Michigan Social Security Number Privacy Act requires a written policy; this one covers all worker information.
  const PRIVACY_POLICY = "Employee Information Privacy Policy\nMangiapane Brothers Lawn and Snow LLC \u00b7 Effective October 17, 2026\n\n1. Why this policy exists\nThe Company collects personal information from the people who work for it, as employees or as contractors, so it can hire them, pay them, meet tax and immigration law, and keep them safe. This policy says what the Company collects, who may see it, how it is protected, how long it is kept, and how it is destroyed. It is also the Company's privacy policy under the Michigan Social Security Number Privacy Act (MCL 445.81 to 445.87).\n\n2. What this policy covers\nEvery piece of personal information the Company holds about a worker, applicant or former worker, on paper or in any computer system, including:\na. Social Security numbers and taxpayer identification numbers.\nb. Tax forms (W-4, MI-W4, W-9), the I-9 and the identity and work-authorization documents shown for it.\nc. Bank routing and account numbers for direct deposit.\nd. Date of birth, driver's license or state ID number, home address, phone, personal email and emergency contacts.\ne. Pay rates, pay records, hours, time clock records and payroll records.\nf. Hiring records: applications, r\u00e9sum\u00e9s, interview and reference notes, background or driving record checks.\ng. Personnel records: agreements, employee reports, discipline, training records and certifications.\nh. Work records made by the Company's systems: route check-offs, job photos, clock-in and clock-out times and the location data that comes with them.\ni. Medical or injury information given for a workplace injury or a leave request.\n\n3. How the information is used\nThe Company uses this information only to hire, onboard, schedule, train, supervise and pay workers; to withhold and report taxes; to verify work eligibility; to report new hires as Michigan requires; to handle workers' compensation, unemployment and insurance; to contact a worker or his emergency contact; and to meet any other legal requirement. The Company does not sell worker information and does not use it for marketing.\n\n4. Social Security numbers\na. The Company collects a Social Security number only when the law or a legitimate business need requires it: tax forms, the I-9, payroll, new-hire reporting, and background or driving record checks the worker has authorized.\nb. The Company will not put more than four sequential digits of a Social Security number on anything that is publicly displayed, on an ID card or badge, on a time card or schedule, or on anything mailed or emailed where the number can be seen without opening it.\nc. The Company will not use a Social Security number as an employee number, a user name or a password, and will not send a full number by unencrypted email or text.\nd. A full Social Security number is shown only to the people listed in section 6, and only when the task in front of them needs it. Everywhere else the Company's systems show it masked, with no more than the last four digits.\n\n5. How the information is protected\na. Tax, I-9, W-9 and direct deposit forms completed online are locked (encrypted) on the worker's own device before they are sent, and are stored only in that locked form. Opening one takes the paperwork password, and the Company's access rules let only the owner and the administrators the owner names in writing open them.\nb. All other worker records are kept in the Company's internal system, which requires a Google sign-in on the Company's access list. Each person sees only what his role needs: a crew member sees his own records; a crew manager sees his own crew's contact and emergency information and shifts, not their pay rates, tax forms or bank details.\nc. Paper records with sensitive information (for example a paper I-9 or a signed W-4) are kept in a locked cabinet or locked container, never in a vehicle, and never left on a desk unattended.\nd. I-9 forms and copies of identity documents are kept apart from the general personnel file.\ne. Company accounts that can reach worker records use strong passwords and two-step verification.\nf. Workers' records are not taken off Company systems, printed or copied except for a business purpose.\n\n6. Who may see sensitive information\nSensitive information (sections 2a to 2c and 2i) may be seen only by: the owner; administrators the owner has named in writing for that purpose; the Company's payroll provider, accountant and attorney, as their work requires; and government agencies when the law requires. Crew managers and other workers may not see it.\n\n7. Sharing outside the Company\nThe Company shares worker information only: with its payroll, accounting, insurance and software providers, as their service needs and under their own confidentiality duties; with government agencies as the law requires (for example the IRS, the Michigan Department of Treasury, Michigan New Hire Reporting, the Unemployment Insurance Agency, and immigration authorities for the I-9); to answer a subpoena, court order or other legal process; and with the worker's own written permission. The Company confirms employment and dates of employment to outside callers only with the worker's permission.\n\n8. How long records are kept\na. I-9 forms: three years after the date of hire, or one year after employment ends, whichever is later.\nb. Payroll, tax and time records: at least four years after the tax is due or paid, whichever is later.\nc. Personnel and hiring records: at least three years after employment ends, or longer while a claim or lawsuit is open.\nd. Applicants who are not hired: at least one year after the hiring decision.\n\n9. How records are destroyed\nWhen a record is past its keeping period, it is destroyed so it cannot be read or put back together: paper is shredded (cross-cut) or given to a document destruction service; electronic records are deleted from the Company's systems and from any backups the Company controls; devices are wiped before they are sold, given away or thrown out.\n\n10. If something goes wrong\nAnyone who learns that worker information was lost, stolen, sent to the wrong person or seen by someone who should not have seen it must tell the owner the same day. The Company will look into it, limit the harm, and notify the affected people and any agency as Michigan's Identity Theft Protection Act and other laws require.\n\n11. Your rights\nA worker may ask to see the personnel record the Company keeps on him, as Michigan's Bullard-Plawecki Employee Right to Know Act allows, and may submit a written statement disagreeing with something in it. Ask the owner in writing.\n\n12. Breaking this policy\nAnyone who looks at, uses or shares worker information in a way this policy does not allow, or who knowingly breaks section 4, is subject to discipline up to and including termination, or ending a contractor's agreement, and may be reported to the authorities when the law has been broken.\n\n13. Questions and changes\nQuestions go to the owner, Russel Mangiapane III, at 734-450-2400 or admin@mangbrothers.com. The Company may update this policy and will give workers the new version.";
  const POSITIONS = { manager:"Crew manager", member:"Crew member", walker:"Door hanger distributor", walkerpt:"Door hanger (part-time)", office:"Office" };
  // Legal status that goes with each position by default (the office can change it per person).
  const STATUS_FOR = { manager:"w2", member:"w2", walker:"1099", walkerpt:"1099", office:"w2" };
  // Which agreement each position signs (the signing service holds the Drive copy of each).
  const AGREEMENT_FOR = { manager:"manager", member:"member", walker:"walker", walkerpt:"walkerpt" };
  // The packet for a position and legal status. Direct deposit is optional (a check is paid otherwise).
  function packet(position, type){
    const f = [];
    if(AGREEMENT_FOR[position]) f.push("agreement");
    f.push("privacy");
    if(type === "1099") f.push("w9"); else f.push("w4","miw4","i9");
    f.push("deposit");
    return f;
  }
  const COMPANY = { name:"Mangiapane Brothers Lawn and Snow LLC", short:"Mangiapane Brothers", address:"3540 Thorn Tree Ct.", city:"Ann Arbor", state:"MI", zip:"48105",
    phone:"734-450-2400", rep:"Russel Mangiapane III", repTitle:"Owner" };

  // ---------- encoding ----------
  const b64 = buf => { const u = buf instanceof Uint8Array ? buf : new Uint8Array(buf); let s=""; for(let i=0;i<u.length;i+=0x8000) s+=String.fromCharCode.apply(null, u.subarray(i,i+0x8000)); return btoa(s); };
  const unb64 = s => { const bin=atob(s); const u=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; };
  const subtle = () => crypto.subtle;
  const ITER = 600000;

  // ---------- the vault ----------
  async function pwKey(pw, salt, iter){ const base=await subtle().importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
    return subtle().deriveKey({ name:"PBKDF2", salt, iterations:iter, hash:"SHA-256" }, base, { name:"AES-GCM", length:256 }, false, ["encrypt","decrypt"]); }
  async function seal(key, bytes){ const iv=crypto.getRandomValues(new Uint8Array(12)); return { iv:b64(iv), ct:b64(await subtle().encrypt({ name:"AES-GCM", iv }, key, bytes)) }; }
  async function unseal(key, o){ return new Uint8Array(await subtle().decrypt({ name:"AES-GCM", iv:unb64(o.iv) }, key, unb64(o.ct))); }
  const normCode = c => String(c||"").replace(/[^A-Za-z0-9]/g,"").toUpperCase();
  function recoveryCode(){ const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", r=crypto.getRandomValues(new Uint8Array(24)); let s="";
    r.forEach((x,i)=>{ s+=A[x%32]; if(i%4===3 && i<23) s+="-"; }); return s; }
  // A new vault: a key pair, the private half locked by the password and, separately, by a one-time recovery code.
  async function create(password){
    const kp=await subtle().generateKey({ name:"RSA-OAEP", modulusLength:3072, publicExponent:new Uint8Array([1,0,1]), hash:"SHA-256" }, true, ["encrypt","decrypt"]);
    const pub=b64(await subtle().exportKey("spki", kp.publicKey)), priv=new Uint8Array(await subtle().exportKey("pkcs8", kp.privateKey));
    const salt=crypto.getRandomValues(new Uint8Array(16)), rsalt=crypto.getRandomValues(new Uint8Array(16)), code=recoveryCode();
    const a=await seal(await pwKey(password, salt, ITER), priv), r=await seal(await pwKey(normCode(code), rsalt, ITER), priv);
    priv.fill(0);
    return { pub, key:{ v:1, iter:ITER, salt:b64(salt), iv:a.iv, priv:a.ct, rsalt:b64(rsalt), riv:r.iv, rpriv:r.ct }, code };
  }
  // Unlock with the password (or the recovery code). A wrong one fails the AES-GCM check and throws.
  async function unlock(key, secret, recovery){
    const k = recovery ? await pwKey(normCode(secret), unb64(key.rsalt), key.iter) : await pwKey(secret, unb64(key.salt), key.iter);
    let priv; try { priv = await unseal(k, recovery ? { iv:key.riv, ct:key.rpriv } : { iv:key.iv, ct:key.priv }); }
    catch(e){ throw new Error(recovery ? "That recovery code is not right." : "That password is not right."); }
    const privateKey = await subtle().importKey("pkcs8", priv, { name:"RSA-OAEP", hash:"SHA-256" }, false, ["decrypt"]);
    return { privateKey, priv };
  }
  // A new password for the same key pair (after unlocking with the old password or the recovery code).
  async function rewrap(key, priv, newPassword){ const salt=crypto.getRandomValues(new Uint8Array(16)); const a=await seal(await pwKey(newPassword, salt, key.iter), priv);
    return Object.assign({}, key, { salt:b64(salt), iv:a.iv, priv:a.ct }); }
  // Seal answers and a file for the office: a fresh AES key per item, itself sealed with the office's public key.
  async function sealFor(pubB64, fields, fileBytes){
    const pub=await subtle().importKey("spki", unb64(pubB64), { name:"RSA-OAEP", hash:"SHA-256" }, false, ["encrypt"]);
    const dk=await subtle().generateKey({ name:"AES-GCM", length:256 }, true, ["encrypt"]), raw=await subtle().exportKey("raw", dk);
    const j=new TextEncoder().encode(JSON.stringify(fields||{})), f=fileBytes||new Uint8Array(0), buf=new Uint8Array(4+j.length+f.length);
    new DataView(buf.buffer).setUint32(0, j.length); buf.set(j,4); buf.set(f,4+j.length);
    const s=await seal(dk, buf);
    return { v:1, alg:"RSA-OAEP-3072/AES-GCM-256", k:b64(await subtle().encrypt({ name:"RSA-OAEP" }, pub, raw)), iv:s.iv, ct:s.ct };
  }
  async function openFor(privateKey, env){
    const raw=await subtle().decrypt({ name:"RSA-OAEP" }, privateKey, unb64(env.k));
    const dk=await subtle().importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
    const buf=await unseal(dk, env), n=new DataView(buf.buffer, buf.byteOffset).getUint32(0);
    return { fields:JSON.parse(new TextDecoder().decode(buf.subarray(4,4+n))), file:buf.slice(4+n) };
  }

  // ---------- checks ----------
  const digits = s => String(s||"").replace(/\D/g,"");
  const fmtSSN = s => { const d=digits(s); return d.length===9 ? `${d.slice(0,3)}-${d.slice(3,5)}-${d.slice(5)}` : d; };
  const validSSN = s => { const d=digits(s); return d.length===9 && !/^(000|666|9)/.test(d) && d.slice(3,5)!=="00" && d.slice(5)!=="0000"; };
  const validRouting = s => { const d=digits(s); if(d.length!==9) return false; const w=[3,7,1,3,7,1,3,7,1]; return d.split("").reduce((n,c,i)=>n+(+c)*w[i],0)%10===0; };
  const mdY = iso => { if(!iso) return ""; const [y,m,d]=String(iso).split("-"); return y&&m&&d ? `${m}/${d}/${y}` : String(iso); };
  const mdYdigits = iso => mdY(iso).replace(/\//g,"");
  const nowStamp = ms => new Date(ms||Date.now()).toLocaleString("en-US",{ timeZone:"America/Detroit", month:"short", day:"numeric", year:"numeric", hour:"numeric", minute:"2-digit" })+" ET";
  const todayIso = () => new Intl.DateTimeFormat("en-CA",{ timeZone:"America/Detroit", year:"numeric", month:"2-digit", day:"2-digit" }).format(new Date());
  const money0 = v => { const n=Math.round(+v||0); return n ? n.toLocaleString("en-US") : ""; };

  // ---------- PDF helpers (pdf-lib) ----------
  const L = () => (typeof window!=="undefined" && window.PDFLib) || globalThis.PDFLib;
  async function loadForm(bytes){ const { PDFDocument, PDFName } = L();
    const doc = await PDFDocument.load(bytes, { ignoreEncryption:true });
    const af = doc.catalog.lookup(PDFName.of("AcroForm")); if(af && af.has && af.has(PDFName.of("XFA"))) af.delete(PDFName.of("XFA"));
    return doc; }
  function fieldBox(doc, name){ const f=doc.getForm().getField(name), w=f.acroField.getWidgets()[0], r=w.getRectangle();
    const pref=w.P(); let page=doc.getPages().findIndex(p=>p.ref===pref); if(page<0) page=0; return { page, x:r.x, y:r.y, w:r.width, h:r.height }; }
  const setT = (form, name, v) => { if(v==null || v==="") return; const f=form.getTextField(name); try{ f.setMaxLength(undefined); }catch(e){} f.setText(String(v)); };
  const check = (form, name, on) => { if(on) form.getCheckBox(name).check(); };
  async function drawSig(doc, dataUrl, box){ if(!dataUrl) return; const png=await doc.embedPng(dataUrl); const page=doc.getPages()[box.page];
    let h=Math.min(box.h+4, 26), w=png.width*(h/png.height); if(w>box.w-4){ w=box.w-4; h=w*(png.height/png.width); }
    page.drawImage(png, { x:box.x+2, y:box.y+1, width:w, height:h }); }
  async function drawText(doc, page, x, y, text, size){ const font=await doc.embedFont(L().StandardFonts.Helvetica); doc.getPages()[page].drawText(String(text), { x, y, size:size||9, font, color:L().rgb(0,0,0) }); }
  async function audit(doc, page, a){ const font=await doc.embedFont(L().StandardFonts.Helvetica), p=doc.getPages()[page];
    const t=`Signed electronically by ${a.name} on ${nowStamp(a.at)} through a private ${COMPANY.short} paperwork link sent to ${a.email||"the employee"}. Document ${a.id||""}`;
    p.drawText(t.slice(0,190), { x:24, y:8, size:6.2, font, color:L().rgb(0.25,0.25,0.25) }); }
  async function finish(doc){ try { doc.getForm().flatten(); } catch(e){} return await doc.save(); }

  // ---------- the forms ----------
  // f: the employee's answers; a: { name, email, at, id } for the signature line and audit footer.
  async function buildW4(bytes, f, a){

// ---------- inputs ----------
const inp = (k, label, o) => { o=o||{}; const v = me[k]!=null ? me[k] : "";
  return `<div class="f ${o.cls||""}"><label for="i_${k}">${esc(label)}</label><input id="i_${k}" data-k="${k}" value="${esc(v)}" ${o.type?`type="${o.type}"`:""} ${o.mode?`inputmode="${o.mode}"`:""} ${o.ac?`autocomplete="${o.ac}"`:""} ${o.ph?`placeholder="${esc(o.ph)}"`:""} ${o.req===false?"":"data-req"} ${o.max?`maxlength="${o.max}"`:""}>${o.help?`<p class="help">${o.help}</p>`:""}</div>`; };
const sel = (k, label, opts, o) => { o=o||{}; const v = me[k]!=null ? me[k] : "";
  return `<div class="f"><label for="i_${k}">${esc(label)}</label><select id="i_${k}" data-k="${k}" ${o.req===false?"":"data-req"}>${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v)===String(a)?"selected":""}>${esc(b)}</option>`).join("")}</select>${o.help?`<p class="help">${o.help}</p>`:""}</div>`; };
const radios = (k, opts) => `<div class="radio">${opts.map(([a,b])=>`<label class="ck"><input type="radio" name="r_${k}" data-k="${k}" value="${esc(a)}" ${String(me[k])===String(a)?"checked":""}><span>${b}</span></label>`).join("")}</div>`;
const cbox = (k, text) => `<label class="ck"><input type="checkbox" data-k="${k}" ${me[k]?"checked":""}><span>${text}</span></label>`;
const nameBlock = () => `<div class="g3">${inp("first","First name",{ac:"given-name"})}${inp("mi","Middle initial",{req:false,max:1})}${inp("last","Last name",{ac:"family-name"})}</div>`;
const addrBlock = () => `${inp("street","Street address",{ac:"address-line1"})}<div class="g3">${inp("city","City",{ac:"address-level2"})}${sel("state","State",STATES.map(s=>[s,s]))}${inp("zip","ZIP",{mode:"numeric",ac:"postal-code",max:10})}</div>${inp("apt","Apartment (if any)",{req:false})}`;
const ssnInp = () => `<div class="g2">${inp("ssn","Social Security number",{mode:"numeric",ac:"off",ph:"123-45-6789",max:11})}${inp("ssn2","Type it again",{mode:"numeric",ac:"off",max:11})}</div>`;
const dobInp = () => inp("dob","Date of birth",{type:"date"});

// ---------- the forms ----------
const SPEC = {
  agreement: () => `
    <p>Read the whole agreement before you sign. It covers your pay (Schedule A), your hours and the rules of the job.</p>
    <p><button id="readAgr" type="button">📄 Read the agreement</button> <span class="meta" id="readNote"></span></p>
    ${nameBlock()}<div class="g2">${inp("phone","Phone",{type:"tel",ac:"tel"})}${inp("email","Email",{type:"email",ac:"email"})}</div>
    ${["walker","walkerpt"].includes(pkt.position) ? inp("strava","Strava username",{help:"You add the company as a follower so finished routes show up."}) : inp("startDate","Start date",{type:"date"})}
    ${cbox("read","I have read the whole agreement, including Schedule A, and agree to it.")}`,
  privacy: () => `
    <p class="meta">How the company collects, uses, protects and destroys your information, and the rules you follow for anyone else's. Read it, then sign that you received it.</p>
    <div class="policy" tabindex="0">${esc(PAPER.PRIVACY_POLICY)}</div>
    ${nameBlock()}
    ${cbox("readPrivacy","I have received and read this policy, and I agree to follow it.")}`,
  w4: () => `
    <p class="meta">Federal income tax withholding. If you are unsure, the IRS estimator at <a href="https://www.irs.gov/w4app" target="_blank" rel="noopener">irs.gov/w4app</a> helps. Most people with one job and no kids pick their filing status and stop there.</p>
    <h3>Step 1: You</h3>${nameBlock()}${addrBlock()}${ssnInp()}
    <div class="lab">Filing status</div>${radios("filing",[["single","Single or married filing separately"],["mfj","Married filing jointly (or qualifying surviving spouse)"],["hoh","Head of household (unmarried and paying more than half the costs of a home for yourself and a qualifying person)"]])}
    <div class="sec"><h3>Step 2: More than one job</h3>${cbox("twoJobs","Check only if you hold more than one job at a time, or are married filing jointly and your spouse also works, and the two jobs pay about the same. Otherwise leave it.")}</div>
    <div class="sec"><h3>Step 3: Dependents</h3><p class="help">Only if your total income will be $200,000 or less ($400,000 married filing jointly).</p>
    <div class="g2">${inp("kids","Children under 17",{mode:"numeric",req:false,ph:"0"})}${inp("otherDeps","Other dependents",{mode:"numeric",req:false,ph:"0"})}</div></div>
    <div class="sec"><h3>Step 4: Other adjustments (optional)</h3>
    <div class="g2">${inp("otherIncome","(a) Other income, per year",{mode:"decimal",req:false,ph:"0"})}${inp("deductions","(b) Deductions beyond the standard",{mode:"decimal",req:false,ph:"0"})}</div>
    ${inp("extra","(c) Extra withholding each paycheck",{mode:"decimal",req:false,ph:"0.00"})}
    ${cbox("exempt","I claim exemption from withholding for 2026: I had no federal income tax liability last year and expect none this year.")}</div>`,
  miw4: () => `
    <p class="meta">Michigan income tax withholding.</p>
    ${nameBlock()}${addrBlock()}${ssnInp()}<div class="g2">${dobInp()}${inp("dl","Driver's license or state ID number")}</div>
    ${inp("exemptions","Personal and dependent exemptions",{mode:"numeric",help:"Usually 1 for yourself, plus 1 for each dependent. Enter 0 if someone else claims you."})}
    ${inp("miExtra","Extra Michigan tax each paycheck (optional)",{mode:"decimal",req:false,ph:"0.00"})}
    <div class="lab">Exemption from Michigan withholding (most people: none)</div>
    ${radios("exempt8",[["","None"],["a","I expect no Michigan income tax liability this year"],["b","My wages are exempt from withholding"],["c","My permanent home is in a Renaissance Zone"]])}
    <div id="ex8" class="${["b","c"].includes(me.exempt8)?"":"hide"}">${inp("exemptWhy","Explain, or name the Renaissance Zone",{req:false})}</div>`,
  i9: () => `
    <p class="meta">Federal proof that you can work in the United States. You fill in Section 1 here. On or before your first day you must show the office your original documents in person: for example a U.S. passport, <b>or</b> a driver's license plus a Social Security card or birth certificate. The office fills in Section 2.</p>
    ${nameBlock()}${inp("otherLast","Other last names used (if any)",{req:false})}${addrBlock()}
    <div class="g2">${dobInp()}${inp("ssn","Social Security number",{mode:"numeric",ac:"off",ph:"123-45-6789",max:11})}</div>
    <div class="g2">${inp("email","Email",{type:"email",req:false})}${inp("phone","Phone",{type:"tel",req:false})}</div>
    <div class="lab">I attest, under penalty of perjury, that I am (check one):</div>
    ${radios("status",[["1","A citizen of the United States"],["2","A noncitizen national of the United States"],["3","A lawful permanent resident"],["4","A noncitizen (other than item 2 and 3) authorized to work"]])}
    <div id="st3" class="${me.status==="3"||me.status==="4"?"":"hide"}">${inp("aNumber","USCIS A-Number",{req:false})}</div>
    <div id="st4" class="${me.status==="4"?"":"hide"}">${inp("workUntil","Authorized to work until (blank if no end date)",{type:"date",req:false})}
      <p class="help">Give one of: the A-Number above, a Form I-94 admission number, or a foreign passport number and country.</p>
      ${inp("i94","Form I-94 admission number",{req:false})}<div class="g2">${inp("passport","Foreign passport number",{req:false})}${inp("passportCountry","Country of issuance",{req:false})}</div></div>
    <div class="sec"><h3>Documents you will show</h3>
    <p class="help">Bring the originals (no copies or photos) on your first day. The office looks at them in person and fills in Section 2. You will also fill out a paper I-9 at the office. Numbers are optional here.</p>
    ${radios("docWhich",[["A","One document from List A (for example a U.S. passport)"],["BC","One from List B and one from List C (for example a driver's license and a Social Security card)"]])}
    <div id="docA" class="${me.docWhich==="A"?"":"hide"}">${sel("aTitle","List A document",[["","Pick one"],["U.S. passport","U.S. passport"],["U.S. passport card","U.S. passport card"],["Permanent resident card (I-551)","Permanent resident card (I-551)"],["Employment authorization document (I-766)","Employment authorization document (I-766)"],["Foreign passport with I-551 stamp or I-94","Foreign passport with I-551 stamp or I-94"]])}
      <div class="g2">${inp("aNum","Document number",{req:false})}${inp("aExp","Expires",{type:"date",req:false})}</div></div>
    <div id="docBC" class="${me.docWhich==="BC"?"":"hide"}">${sel("bTitle","List B document (identity)",[["","Pick one"],["Driver's license","Driver's license"],["State ID card","State ID card"],["School ID card with photo","School ID card with photo"],["Voter registration card","Voter registration card"],["U.S. military card","U.S. military card"]])}
      <div class="g2">${inp("bNum","Document number",{req:false})}${inp("bExp","Expires",{type:"date",req:false})}</div>
      ${sel("cTitle","List C document (work authorization)",[["","Pick one"],["Social Security card (unrestricted)","Social Security card (unrestricted)"],["Birth certificate","Birth certificate"],["Certification of report of birth abroad","Certification of report of birth abroad"],["Native American tribal document","Native American tribal document"]])}
      <div class="g2">${inp("cNum","Document number",{req:false})}${inp("cExp","Expires",{type:"date",req:false})}</div></div></div>
    ${cbox("perjury","I am aware that federal law provides for imprisonment and/or fines for false statements, or the use of false documents, in connection with the completion of this form.")}`,
  w9: () => `
    <p class="meta">For independent contractors: your taxpayer number for the 1099 the company files for you. No tax is taken out of your pay.</p>
    ${nameBlock()}${inp("legalName","Name as shown on your tax return",{req:false,help:"Leave blank if it is your name above."})}${inp("business","Business name (if different)",{req:false})}
    ${sel("taxClass","Federal tax classification",[["individual","Individual or sole proprietor"],["llc","Single-member LLC"],["ccorp","C corporation"],["scorp","S corporation"],["partnership","Partnership"]])}
    ${addrBlock()}
    ${sel("tinType","Taxpayer number",[["ssn","Social Security number"],["ein","Employer identification number (EIN)"]])}
    <div id="tSsn" class="${me.tinType==="ein"?"hide":""}">${ssnInp()}</div><div id="tEin" class="${me.tinType==="ein"?"":"hide"}">${inp("ein","EIN",{mode:"numeric",req:false,ph:"12-3456789",max:10})}</div>
    ${cbox("cert","Under penalties of perjury, I certify that the number shown is my correct taxpayer identification number, I am not subject to backup withholding, I am a U.S. citizen or other U.S. person, and the FATCA code entered (if any) is correct.")}`,
  deposit: () => `
    <p class="meta">Optional. Without it you are paid by check. Find both numbers at the bottom of a check or in your bank's app.</p>
    ${nameBlock()}${addrBlock()}
    ${inp("bankName","Bank name")}
    ${inp("routing","Routing number (9 digits)",{mode:"numeric",ac:"off",max:9})}
    <div class="g2">${inp("account","Account number",{mode:"numeric",ac:"off"})}${inp("account2","Type it again",{mode:"numeric",ac:"off"})}</div>
    ${sel("acctType","Account type",[["checking","Checking"],["savings","Savings"]])}`
};
// Checks per form, after the required fields: returns an error or "".
function extraCheck(id){
  const D = PAPER.digits;
  if(["w4","miw4","w9"].includes(id) && !(id==="w9" && me.tinType==="ein")){ if(D(me.ssn)!==D(me.ssn2)) return "The two Social Security numbers do not match."; }
  if(["w4","miw4","i9"].includes(id) || (id==="w9" && me.tinType!=="ein")){ if(!PAPER.validSSN(me.ssn)) return "That Social Security number is not valid. It is 9 digits."; }
  if(id==="w9" && me.tinType==="ein" && D(me.ein).length!==9) return "An EIN is 9 digits.";
  if(["w4","miw4","i9","w9","deposit"].includes(id) && !/^\d{5}(-?\d{4})?$/.test(String(me.zip||"").trim())) return "Check the ZIP code.";
  if(id==="w4" && !me.filing) return "Pick a filing status.";
  if(id==="i9"){ if(!me.status) return "Check one box for your status."; if(!me.perjury) return "Check the box that you are aware of the penalties.";
    if(me.status==="3" && !me.aNumber) return "Enter your USCIS A-Number.";
    if(me.status==="4" && !me.aNumber && !me.i94 && !(me.passport && me.passportCountry)) return "Enter an A-Number, an I-94 number, or a foreign passport number and country."; }
  if(id==="w9" && !me.cert) return "Check the certification box.";
  if(id==="privacy" && !me.readPrivacy) return "Check the box that you received and read the policy.";
  if(id==="i9"){ if(!me.docWhich) return "Pick which documents you will show the office.";
    if(me.docWhich==="A" && !me.aTitle) return "Pick your List A document.";
    if(me.docWhich==="BC" && !(me.bTitle && me.cTitle)) return "Pick one List B and one List C document."; }
  if(id==="deposit"){ if(!PAPER.validRouting(me.routing)) return "That routing number is not valid. It is the 9 digits at the bottom left of a check.";
    if(D(me.account).length<4 || D(me.account)!==D(me.account2)) return "The two account numbers do not match."; }
  if(id==="agreement" && !me.read) return "Check the box that you have read the agreement.";
  if(id==="miw4" && me.exempt8==="" && !/^\d+$/.test(String(me.exemptions||"").trim())) return "Enter the number of exemptions (a number, 0 or more).";
  if(id==="miw4" && me.dob && me.dob > PAPER.todayIso()) return "Check your date of birth.";
  return "";
}
let pad = null, agrUrl = null;
function openForm(id){
  const F = PAPER.FORMS[id];
  main.innerHTML = `<p><button class="back" id="back">‹ All forms</button></p>
    <div class="card"><h1>${esc(F.title)}</h1><div id="fields">${SPEC[id]()}</div>
      <div class="sec"><h3>Sign</h3>
      <p class="help" style="margin-bottom:8px">Sign with your finger or mouse. By signing you agree to sign this form electronically, and that your electronic signature is the same as your handwritten one.</p>
      <div class="sigwrap"><canvas id="sig"></canvas><span class="x">✕</span></div>
      <div class="row" style="margin-top:6px;justify-content:space-between"><span class="meta">${esc(new Date().toLocaleDateString())}</span><button id="clear" type="button">Clear</button></div></div>
      <p class="err" id="err"></p>
      <button class="primary wide" id="go" style="margin-top:12px">${isSealed(id)?"🔒 Sign, lock, and send":"Sign and send"}</button>
    </div>`;
  $("back").onclick = list;
  const fields = $("fields");
  fields.addEventListener("input", e=>{ const el=e.target, k=el.dataset.k; if(!k) return; me[k] = el.type==="checkbox" ? el.checked : el.value; el.removeAttribute("aria-invalid"); toggles(); });
  fields.addEventListener("change", e=>{ const el=e.target, k=el.dataset.k; if(!k) return; me[k] = el.type==="checkbox" ? el.checked : el.value; toggles(); });
  // Fields whose defaults show as selected count as answered.
  fields.querySelectorAll("select[data-k]").forEach(s=>{ if(me[s.dataset.k]==null || me[s.dataset.k]==="") me[s.dataset.k]=s.value; });
  pad = sigPad($("sig")); $("clear").onclick = ()=>pad.clear();
  if(id==="agreement"){ $("readAgr").onclick = ()=>{ if(!pkt.agreement){ $("readNote").textContent = pkt.agreementError || "The agreement is not attached to this link. Call the office."; return; }
      if(!agrUrl) agrUrl = URL.createObjectURL(new Blob([PAPER.unb64(pkt.agreement)], { type:"application/pdf" }));
      window.open(agrUrl, "_blank"); $("readNote").textContent = "Opened in a new tab."; }; }
  $("go").onclick = ()=>submit(id);
  scrollTo(0,0);
}
function toggles(){
  const t = (id, on) => { const el=$(id); if(el) el.classList.toggle("hide", !on); };
  t("ex8", ["b","c"].includes(me.exempt8)); t("st3", me.status==="3"||me.status==="4"); t("st4", me.status==="4");
  t("tSsn", me.tinType!=="ein"); t("tEin", me.tinType==="ein"); t("docA", me.docWhich==="A"); t("docBC", me.docWhich==="BC");
}
function sigPad(cv){
  const ctx = cv.getContext("2d"); let drawing=false, last=null, marks=0;
  const fit = ()=>{ const r=cv.getBoundingClientRect(), d=window.devicePixelRatio||1; cv.width=Math.round(r.width*d); cv.height=Math.round(r.height*d); ctx.setTransform(d,0,0,d,0,0); ctx.lineWidth=2.4; ctx.lineCap="round"; ctx.lineJoin="round"; ctx.strokeStyle="#0b1a4a"; };
  fit();
  const pt = e => { const r=cv.getBoundingClientRect(); return { x:e.clientX-r.left, y:e.clientY-r.top }; };
  cv.addEventListener("pointerdown", e=>{ e.preventDefault(); cv.setPointerCapture(e.pointerId); drawing=true; last=pt(e); ctx.beginPath(); ctx.arc(last.x,last.y,1.1,0,7); ctx.fillStyle="#0b1a4a"; ctx.fill(); marks++; });
  cv.addEventListener("pointermove", e=>{ if(!drawing) return; e.preventDefault(); const p=pt(e); ctx.beginPath(); ctx.moveTo(last.x,last.y); ctx.lineTo(p.x,p.y); ctx.stroke(); last=p; marks++; });
  const up = ()=>{ drawing=false; }; cv.addEventListener("pointerup", up); cv.addEventListener("pointercancel", up);
  return { clear(){ ctx.clearRect(0,0,cv.width,cv.height); marks=0; }, empty:()=>marks<8,
    // The signature cropped to its ink, as a PNG.
    png(){ const d=ctx.getImageData(0,0,cv.width,cv.height).data; let x0=cv.width,y0=cv.height,x1=0,y1=0;
      for(let y=0;y<cv.height;y+=2) for(let x=0;x<cv.width;x+=2){ if(d[(y*cv.width+x)*4+3]>20){ if(x<x0)x0=x; if(y<y0)y0=y; if(x>x1)x1=x; if(y>y1)y1=y; } }
      if(x1<=x0) return ""; const m=6; x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(cv.width,x1+m); y1=Math.min(cv.height,y1+m);
      const c=document.createElement("canvas"); c.width=x1-x0; c.height=y1-y0; c.getContext("2d").drawImage(cv,x0,y0,c.width,c.height,0,0,c.width,c.height); return c.toDataURL("image/png"); } };
}
const blankCache = {};
async function blank(id){ if(id==="agreement") return PAPER.unb64(pkt.agreement||""); if(!PAPER.FORMS[id].file) return null;
  if(!blankCache[id]){ const r = await fetch(PAPER.FORMS[id].file); if(!r.ok) throw new Error("The blank form did not load. Check your connection."); blankCache[id] = new Uint8Array(await r.arrayBuffer()); }
  return blankCache[id]; }
async function submit(id){
  const err = $("err"), go = $("go"); err.textContent = "";
  let miss = null; document.querySelectorAll("#fields [data-req]").forEach(el=>{ if(el.closest(".hide")) return; if(!String(el.value||"").trim()){ el.setAttribute("aria-invalid","true"); miss = miss || el; } });
  if(miss){ err.textContent = "Fill in the boxes marked in red."; miss.focus(); return; }
  const x = extraCheck(id); if(x){ err.textContent = x; return; }
  if(pad.empty()){ err.textContent = "Sign in the box above."; return; }
  if(id==="agreement" && !pkt.agreement){ err.textContent = pkt.agreementError || "The agreement did not load. Call the office."; return; }
  if(isSealed(id) && !pkt.pub){ err.textContent = "The office has not finished setting up secure storage. Try again later."; return; }
  go.disabled = true; go.textContent = "Filling in the form…";
  try {
    const f = Object.assign({}, me, { sig: pad.png(), mi:(me.mi||"").slice(0,1).toUpperCase() });
    const a = { name:[f.first,f.mi,f.last].filter(Boolean).join(" "), email:me.email||pkt.email, at:Date.now(), id:(TOKEN.slice(-6)+"-"+id).toUpperCase(), date:PAPER.todayIso() };
    const pdf = await PAPER.build(id, await blank(id), f, a, { companySig: pkt.companySig });
    let res;
    if(isSealed(id)){ go.textContent = "Locking it…"; const env = await PAPER.sealFor(pkt.pub, PAPER.keep(id, f), pdf); go.textContent = "Sending…"; res = await call("papersubmit", { form:id, env }); }
    else { go.textContent = "Sending…"; res = await call("papersubmit", { form:id, pdf:PAPER.b64(pdf) }); }
    if(!res || !res.ok) throw new Error(res && res.error || "It did not go through. Try again.");
    copies[id] = URL.createObjectURL(new Blob([pdf], { type:"application/pdf" }));
    const fm = pkt.forms.find(z=>z.id===id); fm.done = true; fm.at = Date.now();
    delete me.ssn2; delete me.account2;
    if(id==="deposit"){ delete me.routing; delete me.account; }
    list();
  } catch(e){ err.textContent = e.message || String(e); go.disabled = false; go.textContent = isSealed(id) ? "🔒 Sign, lock, and send" : "Sign and send"; }
}
window.addEventListener("pagehide", ()=>{ for(const k in me) delete me[k]; });
load();
</script>
