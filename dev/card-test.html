<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>MB Billing sandbox card test</title>
<!--
  Mangiapane Brothers, internal test page (October 15, 2026). SANDBOX ONLY: Intuit test cards, fake money.
  Proves the full v2 path live: reCAPTCHA v3 in this browser, the test card straight to Intuit's sandbox for a token,
  then only the token and the reCAPTCHA token to the signing service, which verifies reCAPTCHA with Google, saves the card
  on the "MB Billing Test" customer and charges $1.00. Refused unless QB_ENV is "sandbox". Delete this page after the test.
-->
<style>
:root{--ink:#16233a;--muted:#4a5a62;--line:#d6dbe0;--ok:#1f6b33;--bad:#a63b3b;--bg:#ffffff;--card:#f6f7f8}
@media (prefers-color-scheme:dark){:root{--ink:#e7ebf0;--muted:#a9b4bd;--line:#3a4450;--ok:#6fcf8a;--bad:#ff8a80;--bg:#12161b;--card:#1b2128}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px}
.warn{border:2px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:600}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#1f6b33;color:#fff;font-weight:600;font-size:16px}
button:disabled{opacity:.5}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body><main>
<h1 style="font-size:22px">MB Billing sandbox card test (with reCAPTCHA)</h1>
<p class="warn">Sandbox only. Uses Intuit's test card 4111 1111 1111 1111. Never type a real card here.</p>
<button id="go">Run the full test: reCAPTCHA, Intuit token, save and charge $1.00</button>
<h2 style="font-size:18px">Result</h2><pre id="out">Nothing yet.</pre>
</main>
<script>
const SVC = "https://script.google.com/macros/s/AKfycbwt8cnCIYbXQT4a_hx0KopppuhlBSIDlKSh7ZI283_SbLeeJrzpuZl-KvmtN2yfzcmyzA/exec";
const TOKENS = "https://sandbox.api.intuit.com/quickbooks/v4/payments/tokens";
const $ = s => document.querySelector(s), out = (t, cls) => { const o=$("#out"); o.textContent=t; o.className=cls||""; };
const lines = [];
const say = (t, cls) => { lines.push(t); out(lines.join("\n"), cls); };
$("#go").onclick = async () => {
  $("#go").disabled = true; lines.length = 0;
  try {
    const ping = await (await fetch(SVC + "?action=ping", { redirect:"follow" })).json();
    if (!ping.captchaKey) return say("FAIL: RECAPTCHA_SITE_KEY is not set in Script Properties (or the new Code.gs is not deployed).", "bad");
    say("PASS 1: signing service is up; site key found; secret set: " + ping.captchaSecretSet);
    await new Promise((ok, no) => { const s=document.createElement("script"); s.src="https://www.google.com/recaptcha/api.js?render="+encodeURIComponent(ping.captchaKey); s.onload=()=>grecaptcha.ready(ok); s.onerror=()=>no(new Error("reCAPTCHA script blocked")); document.head.appendChild(s); });
    say("PASS 2: reCAPTCHA loaded in this browser");
    const r = await fetch(TOKENS, { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ card:{ name:"emulate=0", number:"4111111111111111", expMonth:"12", expYear:"2030", cvc:"123", address:{ postalCode:"48150" } } }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.value) return say("FAIL 3: Intuit answered " + r.status + " " + JSON.stringify(j), "bad");
    say("PASS 3: Intuit token straight to this browser");
    const captcha = await grecaptcha.execute(ping.captchaKey, { action:"card" });
    const res = await (await fetch(SVC, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"sandboxcard", cardToken:j.value, captcha }) })).json();
    say((res.ok ? "PASS 4: " : "FAIL 4: ") + JSON.stringify(res, null, 2), res.ok ? "ok" : "bad");
  } catch (e) { say("FAIL: " + e.message, "bad"); }
  $("#go").disabled = false;
};
</script></body></html>
