<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>MB Billing sandbox card test</title>
<!--
  Mangiapane Brothers, internal test page (October 14, 2026). SANDBOX ONLY: Intuit test cards, fake money.
  Proves the v2 path end to end: this browser sends the test card straight to Intuit's sandbox for a token, then sends only the
  token to the signing service, which saves the card on the "MB Billing Test" customer and charges $1.00.
  The signing service refuses this request unless QB_ENV is "sandbox". Delete this page after the test.
-->
<style>
:root{--ink:#16233a;--muted:#4a5a62;--line:#d6dbe0;--ok:#1f6b33;--bad:#a63b3b;--bg:#ffffff;--card:#f6f7f8}
@media (prefers-color-scheme:dark){:root{--ink:#e7ebf0;--muted:#a9b4bd;--line:#3a4450;--ok:#6fcf8a;--bad:#ff8a80;--bg:#12161b;--card:#1b2128}}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,Segoe UI,Roboto,Arial,sans-serif}
main{max-width:520px;margin:0 auto;padding:24px 16px}
.warn{border:2px solid var(--bad);color:var(--bad);border-radius:8px;padding:10px 12px;font-weight:600}
label{display:block;font-size:14px;color:var(--muted);margin:12px 0 4px}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font-size:16px}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
button{margin-top:16px;width:100%;padding:12px;border:0;border-radius:8px;background:#1f6b33;color:#fff;font-weight:600;font-size:16px}
button:disabled{opacity:.5}
pre{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:10px;white-space:pre-wrap;word-break:break-word;font-size:13px}
.ok{color:var(--ok)}.bad{color:var(--bad)}
</style></head><body><main>
<h1 style="font-size:22px">MB Billing sandbox card test</h1>
<p class="warn">Sandbox only. Use Intuit test cards only. Never type a real card here.</p>
<label for="name">Name on card (emulate=0 approves)</label><input id="name" value="emulate=0">
<label for="num">Card number</label><input id="num" value="4111111111111111" inputmode="numeric">
<div class="row"><div><label for="mm">Month</label><input id="mm" value="12"></div><div><label for="yy">Year</label><input id="yy" value="2030"></div><div><label for="cvc">Security code</label><input id="cvc" value="123"></div></div>
<label for="zip">ZIP</label><input id="zip" value="48150">
<button id="go">1. Get a card token from Intuit (sandbox)</button>
<button id="charge" disabled>2. Save it and charge $1.00 (sandbox)</button>
<h2 style="font-size:18px">Result</h2><pre id="out">Nothing yet.</pre>
</main>
<script>
const SVC = "https://script.google.com/macros/s/AKfycbwt8cnCIYbXQT4a_hx0KopppuhlBSIDlKSh7ZI283_SbLeeJrzpuZl-KvmtN2yfzcmyzA/exec";
const TOKENS = "https://sandbox.api.intuit.com/quickbooks/v4/payments/tokens";
const $ = s => document.querySelector(s), out = (t, cls) => { const o=$("#out"); o.textContent=t; o.className=cls||""; };
let cardToken = "";
$("#go").onclick = async () => {
  out("Asking Intuit's sandbox for a token…");
  try {
    const r = await fetch(TOKENS, { method:"POST", headers:{ "Content-Type":"application/json", "Accept":"application/json" },
      body: JSON.stringify({ card:{ name:$("#name").value, number:$("#num").value.replace(/\D/g,""), expMonth:$("#mm").value, expYear:$("#yy").value, cvc:$("#cvc").value, address:{ postalCode:$("#zip").value } } }) });
    const j = await r.json().catch(() => ({}));
    if (!r.ok || !j.value) return out("Intuit answered " + r.status + ":\n" + JSON.stringify(j, null, 2), "bad");
    cardToken = j.value; $("#charge").disabled = false;
    out("PASS step 1: this browser got a token straight from Intuit. The card number went only to Intuit.\nToken starts: " + cardToken.slice(0, 8) + "…", "ok");
  } catch (e) { out("FAIL step 1: the browser could not reach Intuit (" + e.message + "). This is the browser check (CORS) we need to pass.", "bad"); }
};
$("#charge").onclick = async () => {
  $("#charge").disabled = true; out("Sending only the token to the signing service…");
  try {
    const r = await fetch(SVC, { method:"POST", redirect:"follow", headers:{ "Content-Type":"text/plain;charset=utf-8" }, body: JSON.stringify({ action:"sandboxcard", cardToken }) });
    const j = await r.json();
    out((j.ok ? "PASS step 2: " : "FAIL step 2: ") + JSON.stringify(j, null, 2), j.ok ? "ok" : "bad");
  } catch (e) { out("FAIL step 2: " + e.message, "bad"); }
  cardToken = "";
};
</script></body></html>
